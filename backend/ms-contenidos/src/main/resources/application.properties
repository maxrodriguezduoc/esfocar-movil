spring.application.name=ms-contenidos
server.port=8083

# Base de datos H2 en archivo (persistente, no requiere instalar nada)
spring.datasource.url=jdbc:h2:file:./data/contenidos-db
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Consola web de la BD: http://localhost:8083/h2-console
spring.h2.console.enabled=true
